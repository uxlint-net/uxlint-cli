# Bleeding-edge container image for uxlint's DEV environment.
#
# The audit worker obtains the CLI by copying it out of a published image (see release.yml's `image`
# job and audit-worker/Dockerfile in the uxlint monorepo). That is a deliberate improvement over
# downloading a tarball at Docker build time — a registry tag can't be observed half-written — but it
# left dev with no way to run UNRELEASED collector changes, which is the whole point of dev: exercise
# a capture fix against dev.uxlint.net before it's tagged.
#
# So this branch gets its own moving tag. Push to `dev` here, and `ghcr.io/uxlint-net/uxlint-cli:dev`
# is rebuilt from source; the dev worker pins UXLINT_CLI_REF=dev and picks it up on its next deploy.
# The flow mirrors the monorepo's: work on `dev`, promote to `main`, tag a release.
#
# This REPLACES the old arrangement, where the worker image cloned the branch and ran `cargo build`
# inside the Docker build. Same bleeding edge, but compiled once here instead of on every Railway
# deploy — so dev deploys got faster, not slower.
#
# Actions is free on standard runners for public repositories, and this repo is public, so the
# per-push cost here is time, not credits.
name: dev-image

on:
  push:
    branches: [dev]
  # Manual rebuild — e.g. to repair a failed push without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to `dev` supersedes this one: the tag is a moving pointer, so finishing an older build
# would race to publish a STALER image than the one already queued behind it.
concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          # Same glibc-floor reasoning as release.yml: build on 22.04 (glibc 2.35), never
          # ubuntu-latest (24.04 = 2.39), or the binary won't load on the bookworm-based worker image.
          - platform: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - platform: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      # Keyed on the branch so successive dev pushes reuse the compiled dependency graph — the
      # difference between a ~1min incremental rebuild and a cold ~5min one on every capture tweak.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: dev-image-${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/uxlint
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dev-*
          path: dl
      # download-artifact lands each one under its own directory; the image Dockerfile selects by
      # TARGETARCH, so flatten to `uxlint-<arch>` first. Executable bit does not survive the
      # artifact round-trip.
      - name: Stage build context
        run: |
          set -euo pipefail
          mkdir -p ctx
          mv dl/dev-amd64/uxlint ctx/uxlint-amd64
          mv dl/dev-arm64/uxlint ctx/uxlint-arm64
          chmod +x ctx/uxlint-amd64 ctx/uxlint-arm64
          # Identical to release.yml's image: FROM scratch, nothing but the binary — no base to
          # patch, no CVE surface inherited by anything that copies out of it.
          cat > ctx/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY uxlint-${TARGETARCH} /usr/local/bin/uxlint
          EOF
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker buildx build ctx --platform linux/amd64,linux/arm64 --tag "$image:dev" --push
      # Prove it's consumable the way the audit worker consumes it, on the machine that just pushed
      # it. libssl3 because the CLI links native-tls (OpenSSL) — on a bare base the binary doesn't
      # load at all and exits 127, which reads as a corrupt image rather than a missing runtime dep.
      - name: Verify it is consumable
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "FROM $image:dev AS cli"
            echo "FROM debian:bookworm-slim"
            echo "RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3"
            echo "COPY --from=cli /usr/local/bin/uxlint /usr/local/bin/uxlint"
            echo "RUN /usr/local/bin/uxlint --version"
          } > verify.Dockerfile
          docker buildx build --platform linux/amd64 --file verify.Dockerfile --progress plain .
