# Publish uxlint to the official MCP Registry (modelcontextprotocol/registry).
#
# The registry hosts METADATA only — `server.json` points at the npm package the release workflow
# already publishes, and the registry proves we own it by matching `mcpName` inside that package
# against the server name here. So this job has nothing to build: it sets the version and publishes.
# (It used to pack a `.mcpb` binary bundle, which was the right shape while there was no npm package.
# There is one now, and an artifact you don't have to build is one that can't be built wrong.)
#
# MANUAL on purpose. The first publish CLAIMS the `io.github.uxlint-net/*` namespace, and a namespace
# claim should be a decision someone makes, not a side effect of tagging a patch. Watch one run end to
# end, then — if you want it automatic — change the trigger to `on: push: tags: ["v*"]` so it rides the
# existing release flow. Run it AFTER that version is on npm: the registry rejects a package version
# it cannot find.
name: publish-mcp

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.26). Must already be published to npm."
        required: true

permissions:
  id-token: write # OIDC: how the registry verifies we own the namespace
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # server.json is committed carrying the last published version; the registry needs it to
      # describe the version being published NOW, and the npm package entry has to agree with it.
      - name: Point server.json at this release
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
