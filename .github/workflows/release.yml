# Release: build the uxlint CLI for every target that compiles, and publish the checksummed
# tarballs as GitHub Release assets (softprops/action-gh-release) — no self-hosted bucket, no
# custom upload token. This supersedes the private monorepo's old self-hosted-bucket release.yml
# (see SPLIT-PLAN.md's "GitHub Releases, not the self-hosted bucket" decision): once this crate is
# a public repo, GITHUB_TOKEN (automatic, scoped to `contents: write` for this one job) is the
# entire auth story.
#
# Windows is deliberately NOT in the matrix: client/src/reaper.rs calls libc::kill/SIGKILL/SIGHUP
# unconditionally, which doesn't compile for any windows target. Promising a Windows build here
# would be a lie until that file grows a #[cfg(windows)] arm.
#
# NOTE: this file lives at client/.github/workflows/release.yml inside uxlint's private monorepo
# (WP41 extraction prep) — GitHub only runs workflows from a repo's OWN top-level .github/, so this
# is inert until client/ is lifted into its own repo, at which point this becomes release.yml at
# that repo's root and `tag push` actually fires it.
name: release
on:
  push:
    tags: ["v*"]
  # Backfill/repair path: publish the CONTAINER IMAGE for a tag that already has a GitHub Release,
  # without re-running the build matrix. The image job repackages published tarballs rather than
  # recompiling, so this costs one small ubuntu job instead of four (two of them macOS, which bills
  # at 10x). Use it when the image push failed on its own, or to backfill a pre-image release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish the container image for (e.g. v0.1.16)"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          # Build linux on ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest (24.04 = glibc 2.39): a binary
          # links against its build-host glibc and needs that version OR NEWER at runtime. A 24.04
          # build fails on Debian bookworm (glibc 2.36) — including our own audit-worker image — and on
          # any user distro older than 24.04. Built on 2.35 it runs on bookworm and everything newer.
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm64 runner (no cross-toolchain to install/maintain); same glibc-floor reasoning.
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Intel macOS: cross-compiled from the arm64 runner. GitHub retired the Intel `macos-13`
          # runner (jobs sit queued forever), so build the x86_64 target on macos-latest — Apple's
          # SDK links both arches, and reqwest's native-tls uses Security.framework (not OpenSSL), so
          # there's no cross-arch C dependency to satisfy.
          - platform: macos-x64
            target: x86_64-apple-darwin
            os: macos-latest
          - platform: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # Filename is `uxlint-{platform}.tar.gz` (no version in the name — the version lives in the
      # release tag/URL), matching what install.sh expects to find at
      # releases/latest/download/uxlint-{platform}.tar.gz.
      - name: Package
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf uxlint-${{ matrix.platform }}.tar.gz uxlint
          # shasum (not sha256sum) — the only one guaranteed present on BOTH the ubuntu and macos
          # runners in this matrix; macOS has no sha256sum by default.
          shasum -a 256 uxlint-${{ matrix.platform }}.tar.gz > uxlint-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/uxlint-${{ matrix.platform }}.tar.gz
            target/${{ matrix.target }}/release/uxlint-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
      # The machine-readable CLI reference the docs site renders (see src/docs_json.rs). It's
      # generated from THIS release's freshly-built binary, so the published reference can never
      # drift from what the binary accepts. Platform-independent, so emit it once — from the native
      # linux-x64 build, which runs on its own x64 runner. The server serves the latest release's
      # copy (cached ~1 day), so /docs/cli tracks the newest uxlint without a web redeploy.
      - name: Generate CLI reference
        if: matrix.platform == 'linux-x64'
        run: ./target/${{ matrix.target }}/release/uxlint docs-json > cli-reference.json
      - name: Upload CLI reference
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-reference
          path: cli-reference.json
          if-no-files-found: error

  # One job, after every target has built, so a partial matrix failure never publishes a release
  # with some targets missing.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dl
          merge-multiple: true
      # Immutable releases (enabled org-wide) SEAL a release on publish and reject asset uploads
      # afterward — so assets must be attached BEFORE it's finalized. Create a DRAFT holding every
      # asset, then flip it to published: the assets are already in place when it seals.
      # (softprops/action-gh-release creates-then-uploads, which fails the moment the release seals.)
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dl/*.tar.gz dl/*.tar.gz.sha256 dl/cli-reference.json \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # ── CONTAINER IMAGE ──────────────────────────────────────────────────────────────────────────────
  # The `uxlint` binary, published as a container image so CONSUMERS CAN COPY IT INSTEAD OF
  # DOWNLOADING IT. uxlint's own audit-worker image used to `curl` the release tarball at Docker build
  # time; that put a website in the build path, and on 2026-08-07 it bit us — the worker's build ran
  # the download four minutes before the v0.1.16 assets finished uploading, 404'd, and failed the
  # deploy. A registry tag cannot be observed half-written: it resolves only once the push completes,
  # so that race is not merely unlikely here, it is unrepresentable. The registry also verifies the
  # layer digest itself, which retires the hand-rolled sha256 comparison on the consumer side.
  #
  # It REPACKAGES the published tarballs rather than recompiling — the bytes we ship in the image are
  # byte-identical to the ones behind `install.sh`, and the job costs a minute on ubuntu rather than a
  # second pass over the build matrix.
  image:
    # `always()` so the dispatch path (where build/publish are skipped) still runs; the explicit
    # result check keeps the tag-push path strictly gated on a successful publish.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      # Straight from the release, so the image can only ever contain bytes that were actually
      # published. Verifies each tarball against its own .sha256 sidecar before it goes in.
      - name: Fetch published binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ctx && cd ctx
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'uxlint-linux-*' --dir .
          sha256sum -c uxlint-linux-x64.tar.gz.sha256
          sha256sum -c uxlint-linux-arm64.tar.gz.sha256
          # TARGETARCH vocabulary (amd64/arm64), which is what the image Dockerfile selects on.
          tar xzf uxlint-linux-x64.tar.gz   && mv uxlint uxlint-amd64
          tar xzf uxlint-linux-arm64.tar.gz && mv uxlint uxlint-arm64
          chmod +x uxlint-amd64 uxlint-arm64
      # FROM scratch: this image is a file-delivery vehicle for `COPY --from`, never a thing to run.
      # No base means nothing to patch and no CVE surface inherited by every consumer.
      - name: Write image Dockerfile
        run: |
          cat > ctx/Dockerfile <<'EOF'
          FROM scratch
          ARG TARGETARCH
          COPY uxlint-${TARGETARCH} /usr/local/bin/uxlint
          EOF
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Both arches the audit worker can be built on. Lowercase the repo name: GHCR rejects uppercase
      # path segments, and `github.repository` preserves the owner's casing.
      # `:latest` moves only on a real tag push, never on a dispatch — backfilling the image for an
      # OLD release must not silently make it the newest. It exists because the audit worker's
      # UXLINT_CLI_REF accepted `latest` before it copied from a registry, so an environment still
      # set that way keeps working rather than failing with "manifest unknown".
      - name: Build and push
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags=(--tag "$image:${{ steps.tag.outputs.tag }}")
          [ "${{ github.event_name }}" = "push" ] && tags+=(--tag "$image:latest")
          docker buildx build ctx \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --push
      # Prove the published image is actually consumable the way the audit worker consumes it,
      # on the machine that just pushed it — a push that succeeds but yields an unusable image
      # (wrong path, wrong arch, non-executable) would otherwise surface as a broken deploy.
      - name: Verify it is consumable
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # libssl3 because the CLI's reqwest links native-tls (OpenSSL) on linux — bookworm-slim has
          # no libssl.so.3, so a bare base makes `uxlint --version` exit 127 and looks like a broken
          # image rather than a missing runtime dep. The audit-worker's runtime gets it transitively
          # via chromium, but this check states the dependency instead of relying on that.
          {
            echo "FROM $image:${{ steps.tag.outputs.tag }} AS cli"
            echo "FROM debian:bookworm-slim"
            echo "RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3"
            echo "COPY --from=cli /usr/local/bin/uxlint /usr/local/bin/uxlint"
            echo "RUN /usr/local/bin/uxlint --version"
          } > verify.Dockerfile
          docker buildx build --platform linux/amd64 --file verify.Dockerfile --progress plain .
